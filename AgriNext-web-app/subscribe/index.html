<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Agri Next Subscription</title>
    <style>
        body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f6f2;
}

.container {
  text-align: center;
  margin-top: 120px;
}

.container h1 {
  color: #1f6b2d;
}

.container p {
  color: #555;
}

button {
  padding: 12px 24px;
  background: #2e7d32;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background: #256628;
}

/* Overlay */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  justify-content: center;
  align-items: center;
}

/* Form Box */
.form-box {
  background: white;
  padding: 25px;
  width: 360px;
  border-radius: 8px;
}

.form-box h2 {
  margin-bottom: 15px;
  color: #2e7d32;
}

.form-box input {
  width: 100%;
  padding: 10px;
  margin-bottom: 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

.cancel {
  background: #9e9e9e;
  margin-left: 10px;
}

    </style>
</head>


<body>

    <div class="container">
        <h1>Smart Farming Delivered to Your Inbox</h1>
        <p>No spam. Only useful agriculture updates.</p>
        <button id="subscribeBtn">Subscribe Now</button>
    </div>

    <!-- Popup Form -->
    <div class="overlay" id="overlay">
        <div class="form-box">
            <h2>Subscribe to Agri Next</h2>

            <form id="subscribeForm">
                <input type="text" name="name" placeholder="Full Name" required>
                <input type="email" name="email" placeholder="Email Address" required>
                <input type="tel" name="phone" placeholder="Mobile Number" required>
                <input type="text" name="location" placeholder="Village / City">
                <input type="text" name="crop" placeholder="Main Crop">

                <button type="submit">Submit</button>
                <button type="button" class="cancel" id="closeBtn">Cancel</button>
            </form>
        </div>
    </div>

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
    // Initialize EmailJS (PUBLIC KEY ONLY)
        emailjs.init("qs3Z7U8ufcBzCqV1N");

        const subscribeBtn = document.getElementById("subscribeBtn");
        const overlay = document.getElementById("overlay");
        const closeBtn = document.getElementById("closeBtn");
        const form = document.getElementById("subscribeForm");

        // Open popup
        subscribeBtn.addEventListener("click", () => {
            overlay.style.display = "flex";
        });

        // Close popup
        closeBtn.addEventListener("click", () => {
            overlay.style.display = "none";
        });

        // Submit form
        form.addEventListener("submit", function (e) {
            e.preventDefault();

            emailjs.sendForm(
                "YOUR_SERVICE_ID",     // EmailJS service ID
                "YOUR_TEMPLATE_ID",    // EmailJS template ID
                this
            ).then(
                function () {
                    alert("Subscription successful! Details sent to admin email.");
                    form.reset();
                    overlay.style.display = "none";
                },
                function (error) {
                    alert("Failed to send details. Try again.");
                    console.log(error);
                }
            );
        });

</script>
</body>

</html>
